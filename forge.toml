# Typewriter installer -- built with Forge (https://github.com/fezcode/Forge)
#
#   .\build.ps1 -Installer         build typewriter.exe, then dist/Typewriter-Setup-<version>.exe
#   .\build-installer.ps1          installer only (typewriter.exe must already exist)
#
# Keep [app] version in step with TYPEWRITER_VERSION in main.c.

[app]
name    = "Typewriter"
version = "0.3.1"
id      = "com.fezcode.typewriter"
icon    = "icon.ico"

[meta]
publisher   = "Fezcode"
homepage    = "https://github.com/fezcode/typewriter"
support_url = "https://github.com/fezcode/typewriter/issues"
comments    = "A distraction-free text editor with the soul of a mechanical typewriter."

[ui]
# mica = the Windows 11 look (same as Descry and Atelier), so setup feels
# native rather than branded.
theme        = "mica"
window_title = "Typewriter ${app.version} Setup"

[install]
# Per-user, no UAC. Typewriter keeps its settings in typewriter.ini next to the
# executable, so the install folder has to be writable by the user -- Program
# Files would silently stop settings from persisting.
default_dir = "${LOCALAPPDATA}/Programs/Typewriter"

[uninstall]
keep          = ["typewriter.ini"]
# typewriter.ini lives in the install folder, so that folder is the "settings dir":
# it is only removed when the user ticks "Also remove my settings and data".
settings_dirs = ["${INSTALLDIR}"]

# --- wizard -----------------------------------------------------------------

[[steps]]
type  = "welcome"
title = "Typewriter ${app.version}"
body  = "This will install Typewriter ${app.version} on your computer.\n\nTypewriter is a distraction-free text editor with the soul of a mechanical typewriter: every keystroke clicks, the bell rings at column 80.\n\nClick Next to continue."

[[steps]]
type           = "license"
title          = "License Agreement"
body           = "Please review the license terms below before continuing."
file           = "LICENSE.txt"
require_scroll = true

# Every step needs an explicit title and body: the themes render
# step.title/step.body directly, so a step without them draws a blank pane.
[[steps]]
type  = "folder"
title = "Select Folder"
body  = "Choose where to install Typewriter ${app.version}."

[[steps]]
type  = "shortcuts"
title = "Select Optional Tasks"
body  = "Check the items you would like the installer to perform."

[[steps]]
type  = "install"
title = "Installing..."
body  = "Copying files to your system."

[[steps]]
type  = "finish"
title = "Installation Complete"
body  = "Typewriter has been installed successfully.\n\nPress Ctrl+K inside the editor for options and keyboard shortcuts."

[[steps.launches]]
kind    = "app"
target  = "${INSTALLDIR}/typewriter.exe"
label   = "Launch Typewriter"
checked = true

# --- payload ----------------------------------------------------------------

# The self-contained executable from `.\build.ps1` (make STATIC=1): SDL2,
# SDL2_ttf, FreeType, the sounds, the icon and the font are all inside it,
# so it is the only binary to ship.
[[files]]
src = "typewriter.exe"
dst = "${INSTALLDIR}/typewriter.exe"

[[files]]
src = "LICENSE.txt"
dst = "${INSTALLDIR}/LICENSE.txt"

[[files]]
src = "README.md"
dst = "${INSTALLDIR}/README.md"

# --- shortcuts --------------------------------------------------------------

[[shortcuts]]
target   = "${INSTALLDIR}/typewriter.exe"
location = "${DESKTOP}"
name     = "Typewriter"
icon     = "${INSTALLDIR}/typewriter.exe"
label    = "Create a desktop shortcut"
optional = true
default  = true

[[shortcuts]]
target   = "${INSTALLDIR}/typewriter.exe"
location = "${STARTMENU}/Fezcode"
name     = "Typewriter"
icon     = "${INSTALLDIR}/typewriter.exe"
label    = "Create a Start Menu entry"
optional = true
default  = true

# --- registry ---------------------------------------------------------------

[[registry]]
hive  = "HKCU"
key   = "Software\\Fezcode\\Typewriter"
value = "InstallDir"
data  = "${INSTALLDIR}"

[[registry]]
hive  = "HKCU"
key   = "Software\\Fezcode\\Typewriter"
value = "Version"
data  = "${app.version}"
